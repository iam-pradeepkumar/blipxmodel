# Render blueprint — deploy with:  render blueprint launch
services:
  - type: web
    name: blipx-indic-voice
    runtime: image        # build from Dockerfile
    dockerfilePath: ./Dockerfile
    plan: gpu             # GPU plan (L4). Falls back to CPU if you pick a CPU plan (slow).
    region: singapore     # closest to India
    healthCheckPath: /health
    envVars:
      - key: DEVICE
        value: cuda
      - key: MODEL_STT
        value: ai4bharat/indic-conformer-600m-multilingual
      - key: MODEL_LLM
        value: sarvamai/sarvam-1
      - key: MODEL_TTS
        value: ai4bharat/indic-parler-tts
      - key: HF_TOKEN
        sync: false        # set in Render dashboard
      - key: PRELOAD
        value: "1"
    disk:
      name: models
      mountPath: /models
      sizeGB: 30
